<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Pesquisa</title>
  <link rel="stylesheet" href="pratica.css">
</head>
<body>

  <h2>Formulário de Pesquisa</h2>
  <div class="formulario-container">
    <form id="formulario">
   
      <div id="boasVindas">
        <p>Seja bem-vindo! Clique aqui :)</p>
      </div>
    
      <div class="mensagemDica">
        <p>Passe o mouse aqui para ver a dica</p>
      </div>
   
      <div id="mensagemEscondida">
        <p>Essa mensagem vai desaparecer se você clicar aqui</p>
      </div>
   
      <div>
        <p name="instrucao">Pressione uma tecla do teclado</p>
      </div>

      <div id="mensagemFinal">
        <p>O resultado do envio aparecerá aqui</p>
      </div>

      <label for="email">Email:</label>
      <input type="text" id="email" name="email"><br><br>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha"><br><br>

      <input type="submit" value="Enviar">
    </form>
  </div>

  <script>

    var formulario = document.getElementById("formulario");

    formulario.addEventListener("submit", function(event) {
      event.preventDefault(); 

      var email = document.getElementById("email").value;
      var senha = document.getElementById("senha").value;

      var mensagem = "Email: " + email + "<br>Senha: " + senha;
      document.getElementById("mensagemFinal").innerHTML = mensagem;
    });

    var boasVindas = document.getElementById("boasVindas");
    boasVindas.addEventListener("click", function() {
      boasVindas.innerHTML = "<p>Obrigado por clicar! :)</p>";
      boasVindas.style.backgroundColor = "yellow";
    });

    var mensagemDica = document.querySelector(".mensagemDica");
    mensagemDica.addEventListener("mouseover", function() {
      mensagemDica.innerHTML = "<p>Você passou o mouse aqui!</p>";
      mensagemDica.style.backgroundColor = "lightgreen";
    });

    mensagemDica.addEventListener("mouseout", function() {
      mensagemDica.innerHTML = "<p>Passe o mouse aqui para ver a dica</p>";
      mensagemDica.style.backgroundColor = "#d1d1d1";
    });

    var caixaInfo = document.getElementById("mensagemEscondida");
    caixaInfo.addEventListener("click", function() {
      caixaInfo.style.display = "none";
    });

    var instrucao = document.getElementsByName("instrucao")[0];
    document.addEventListener("keydown", function() {
      instrucao.innerHTML = "<p>Você apertou uma tecla!</p>";
      instrucao.style.color = "blue";
    });
  </script>
</body>
</html>
